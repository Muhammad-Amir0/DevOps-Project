name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Docker image tag to restore"
        required: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}

      - name: Push latest image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull previous image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ inputs.rollback_tag }}

      - name: Tag previous image as latest
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ inputs.rollback_tag }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest

      - name: Push rollback image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest